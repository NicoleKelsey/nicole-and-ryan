<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Nicole &amp; Ryan</title>
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffdf9;color:#2d2230;font-family:Georgia,serif;text-align:center;padding:1.5rem}
    h1{font-size:2.4rem;font-weight:400;color:#5b4331;margin:.2em 0}
    a{display:inline-block;margin-top:1rem;padding:.8rem 1.8rem;border:1px solid #c4453c;color:#2d2230;text-decoration:none;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem}
    a:hover,a:focus-visible{background:#c4453c;color:#fff}
  </style>
</head>
<body>
  <main>
    <p style="color:#c4453c;letter-spacing:.3em">N &amp; R</p>
    <h1>We can't find that page</h1>
    <p>But we'd love for you to find our wedding website.</p>
    <a id="home-link" href="/">Back to the website</a>
  </main>
  <script>
    // On GitHub Pages project sites the site lives at /REPOSITORY/. Work that out from the URL.
    (function () {
      var seg = location.pathname.split('/')[1];
      var isProjectSite = /\.github\.io$/.test(location.hostname) && seg;
      document.getElementById('home-link').href = isProjectSite ? '/' + seg + '/' : '/';
    })();
  </script>
</body>
</html>
